services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livescoring
      POSTGRES_PASSWORD: livescoring
      POSTGRES_DB: livescoring
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livescoring"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
