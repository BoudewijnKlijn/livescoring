services:
  - type: web
    name: livescoring
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase session pooler, zie README
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false          # https://<naam>.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
